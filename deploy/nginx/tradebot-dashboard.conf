# Snippet for lynch.gdn HTTPS server — public TradeBot dashboard.
# Include inside the existing 443 server block for lynch.gdn / www.lynch.gdn.
#
# URL: https://lynch.gdn/tradebot/
# Auth: HTTP basic (/etc/nginx/.htpasswd-tradebot)

location = /tradebot {
    return 301 /tradebot/;
}

location /tradebot/ {
    auth_basic "TradeBot Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-tradebot;

    # Strip /tradebot prefix; backend serves at /
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /tradebot;
    proxy_read_timeout 60s;
}
